name: Release verification (v2)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
            - name: Run Windows unit tests
        if: runner.os == 'Windows'
        run: npm run test:unit

      - name: Run full tests on Ubuntu
        if: runner.os == 'Linux'
        run: npm test
      - run: node test/release-smoke.cjs
      - run: npm pack --dry-run
  postgres-integration:
    name: PostgreSQL ${{ matrix.pg }} integration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_USER: integration
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Verify SQL execution and lint decisions
        env:
          PGPASSWORD: integration
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: integration
          PGDATABASE: integration
          PG_MAJOR: ${{ matrix.pg }}
        run: bash test/integration/run-postgres.sh
  sarif:
    name: SARIF generation and optional upload
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate and validate SARIF
        run: |
          node bin/cli.js examples/unsafe.sql --format sarif --output report.sarif --fail-on none
          node test/verify-sarif.cjs report.sarif
      - name: Upload SARIF to GitHub code scanning
        id: upload
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
      - name: Report upload status
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "SARIF upload outcome: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != 'success' ]; then
            echo 'SARIF generated correctly, but GitHub code scanning upload failed. Check repository settings, event permissions and code scanning availability.' >> "$GITHUB_STEP_SUMMARY"
          fi
