name: Release verification (v2)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Windows unit tests
        if: runner.os == 'Windows'
        run: npm run test:unit

      - name: Run full tests on Ubuntu
        if: runner.os == 'Linux'
        run: npm test

      - name: Run release smoke checks
        run: node test/release-smoke.cjs

      - name: Verify npm package
        run: npm run test:action-release

  postgres-integration:
    name: PostgreSQL ${{ matrix.pg }} integration
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_USER: integration
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Verify SQL execution and lint decisions
        env:
          PGPASSWORD: integration
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: integration
          PGDATABASE: integration
          PG_MAJOR: ${{ matrix.pg }}
        run: bash test/integration/run-postgres.sh


  sarif:
    name: Generate and validate SARIF
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and validate SARIF
        run: |
          node bin/cli.js examples/unsafe.sql --format sarif --output report.sarif --fail-on none
          node test/verify-sarif.cjs report.sarif

  upload-sarif:
    name: Upload release verification SARIF
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and validate SARIF
        run: |
          node bin/cli.js examples/unsafe.sql --format sarif --output report.sarif --fail-on none
          node test/verify-sarif.cjs report.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: report.sarif
          category: release-verification
