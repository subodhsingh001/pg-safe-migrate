name: ORM migration verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/orm-runner
      - run: npm run verify
        working-directory: scripts/orm-runner
        env:
          DATABASE_URL: postgresql://integration:integration@127.0.0.1:5432/integration
