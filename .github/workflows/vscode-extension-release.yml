
name: VS Code extension release

on:
  workflow_dispatch:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install CLI dependencies
        run: npm ci --no-audit --no-fund

      - name: Run CLI and diagnostics regression tests
        run: npm run test:unit

      - name: Build standalone VS Code extension
        working-directory: vscode-extension
        run: npm run build:standalone

      - name: Verify standalone runtime
        working-directory: vscode-extension
        run: npm run verify:standalone

      - name: Package extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: pg-safe-migrate-vscode-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to VS Code Marketplace
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: verify-and-package
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: pg-safe-migrate-vscode-vsix
          path: dist

      - name: Publish using Trusted Publishing
        run: |
          VSIX=$(find dist -maxdepth 1 -name '*.vsix' -type f -print -quit)
          test -n "$VSIX"
          npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX"
