name: VS Code extension release

on:
  workflow_dispatch:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CLI dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and diagnostics regression tests
        run: npm run test:unit
      - name: Validate tag and extension version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#vscode-v}"
          actual="$(node -p "require('./vscode-extension/package.json').version")"
          test "$expected" = "$actual" || { echo "Tag $expected does not match extension $actual"; exit 1; }
      - name: Build standalone VS Code extension
        working-directory: vscode-extension
        run: npm run build:standalone
      - name: Verify standalone runtime
        working-directory: vscode-extension
        run: npm run verify:standalone
      - name: Package extension
        working-directory: vscode-extension
        run: npx --yes @vscode/vsce@4.1.1 package --no-dependencies
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-safe-migrate-vscode-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pg-safe-migrate-vscode-vsix
          path: dist
      - name: Verify downloaded VSIX version
        shell: bash
        run: |
          set -euo pipefail

          echo "Release tag: $GITHUB_REF_NAME"
          find dist -maxdepth 1 -type f -name '*.vsix' -print

          expected="${GITHUB_REF_NAME#vscode-v}"

          for vsix in dist/*.vsix; do
            actual="$(unzip -p "$vsix" extension/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")"

            echo "VSIX: $vsix"
            echo "Expected version: $expected"
            echo "Actual version: $actual"

            test "$actual" = "$expected" || {
              echo "ERROR: VSIX version does not match release tag"
              exit 1
            }
          done
      - name: Publish with Marketplace Trusted Publishing (OIDC)
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail

          expected="${GITHUB_REF_NAME#vscode-v}"
          VSIX="../dist/pg-safe-migrate-vscode-${expected}.vsix"

          test -f "$VSIX" || {
            echo "ERROR: Expected VSIX not found: $VSIX"
            exit 1
          }

          actual="$(unzip -p "$VSIX" extension/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")"

          echo "Expected version: $expected"
          echo "Packaged version: $actual"

          test "$actual" = "$expected" || {
            echo "ERROR: VSIX version mismatch"
            exit 1
          }

          npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX"