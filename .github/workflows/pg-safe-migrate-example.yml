
# Example workflow for projects using PG Safe Migrate.
# Copy this file into the consuming project's
# .github/workflows directory.
#
# This example assumes:
# - SQL migrations are in ./migrations
# - A gate policy exists at ./pg-safe-migrate-policy.json
# Adjust both paths for your application.

name: PostgreSQL migration safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-migrations:
    name: Check PostgreSQL migrations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PG Safe Migrate
        run: npm install --no-save @subodh001/pg-safe-migrate@2.5.0

      - name: Check migration safety policy
        run: |
          npx --no-install pg-safe-migrate migrations \
            --gate-policy pg-safe-migrate-policy.json \
            --format markdown \
            --output migration-report.md

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-safety-report
          path: migration-report.md
          if-no-files-found: warn
