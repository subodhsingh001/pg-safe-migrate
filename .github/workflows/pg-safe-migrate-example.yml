# Repository-level migration safety verification.
# Tests the current CLI against committed example migrations.

name: PostgreSQL migration safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-migrations:
    name: Check PostgreSQL migrations
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify CLI version
        run: node bin/cli.js --version

      - name: Check migration safety policy
        run: |
          node bin/cli.js examples/migrations \
            --gate-policy examples/week3-gate-policy.json \
            --postgres-version 16 \
            --format markdown \
            --output migration-report.md

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-safety-report
          path: migration-report.md
          if-no-files-found: warn