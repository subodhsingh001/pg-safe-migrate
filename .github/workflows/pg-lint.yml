
name: PostgreSQL migration risk check

on:
  pull_request:
    paths:
      - '**/*.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'bin/**'
      - 'test/**'
      - '.github/workflows/pg-lint.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PostgreSQL migration linter
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Verify CLI
        run: node bin/cli.js --help

      - name: Verify safe migration
        run: node bin/cli.js examples/safe.sql

      - name: Verify unsafe migration is blocked
        shell: bash
        run: |
          set +e
          node bin/cli.js examples/unsafe.sql
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected exit code 1, got $status"
            exit 1
          fi

      - name: Check changed SQL migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node bin/cli.js --changed "origin/$BASE_REF"
